[flake8]
# Hodie flake8 configuration
# Mirrors pylint scope: active code only, not legacy/archived directories.
max-line-length = 120
exclude =
    _CONSOLIDATED,
    _SORTING,
    _BOX_SIMULATION,
    migrations,
    venv,
    env,
    .git,
    __pycache__,
    *.egg-info
# Ignore style warnings that are handled by pylint or are intentional
extend-ignore =
    # E501 long lines — pylint already covers this with max-line-length=120
    E501,
    # W503/W504 — line break before/after binary operator (style preference)
    W503,
    W504
