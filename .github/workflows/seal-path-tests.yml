name: Seal Path Tests

# Offline test of the seal-cue gate in finalize-pr.yml: a comment that carries
# the Claude Code footer, or a cue inside quotes or code, must not seal a PR.
# The test pulls the real gate step out of the workflow, so it fails if the
# workflow drifts. Neither the test nor this job calls an API or writes to
# the repo.
# Added in the second peer swap: the test existed but no workflow ran it.
# Same idea as custos's seal-path-tests.yml.
# Phase C of the file review swap adds the two offline tests for the file review
# checklist and the final oversight rules (both from custos, without observations).
# The Latin workflow swap adds the cue parser test.

on:
  pull_request:
    paths:
      - '.github/workflows/finalize-pr.yml'
      - '.github/workflows/seal-path-tests.yml'
      - 'scripts/test_finalize_gate.sh'
      - '.github/workflows/file-review.yml'
      - '.github/workflows/final-oversight.yml'
      - '.github/scripts/file-review.js'
      - '.github/scripts/final-oversight.js'
      - '.github/scripts/final-oversight-run.js'
      - '.github/review-skip.json'
      - 'scripts/test_file_review.js'
      - 'scripts/test_final_oversight.js'
      - '.github/scripts/cue-parser.js'
      - 'scripts/test_cue_parser.js'
      - 'scripts/test_cue_parser.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML (the test reads the workflow file)
        run: python3 -m pip install --quiet pyyaml

      - name: Seal-cue gate
        run: bash scripts/test_finalize_gate.sh

      - name: File review checklist
        run: node scripts/test_file_review.js

      - name: Final oversight rules
        run: node scripts/test_final_oversight.js

      - name: Cue parser
        run: bash scripts/test_cue_parser.sh
