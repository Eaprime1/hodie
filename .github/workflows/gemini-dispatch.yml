name: 'Gemini Dispatch'

on:
  pull_request_review_comment:
    types: ['created']
  pull_request_review:
    types: ['submitted']
  pull_request:
    types: ['opened']
  issues:
    types: ['opened', 'reopened']
  issue_comment:
    types: ['created']

defaults:
  run:
    shell: 'bash'

jobs:
  dispatch:
    timeout-minutes: 2
    if: |-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false
      ) || (
        github.event_name == 'issues' &&
        contains(fromJSON('["opened", "reopened"]'), github.event.action)
      ) || (
        github.event.sender.type == 'User' &&
        github.event.sender.login != 'dependabot[bot]' &&
        github.event.sender.login != 'renovate[bot]' &&
        startsWith(github.event.comment.body || github.event.review.body || github.event.issue.body || '', '@gemini-cli') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
      )
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      pull-requests: 'read'
      issues: 'read'
    env:
      IS_AUTHORIZED: '${{ contains(fromJSON(''["OWNER", "MEMBER", "COLLABORATOR"]''), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) }}'
    outputs:
      command: '${{ steps.parse.outputs.command }}'
      additional_context: '${{ steps.parse.outputs.additional_context }}'
    steps:
      - name: 'Log event type'
        run: |-
          echo "Event: ${{ github.event_name }}, Action: ${{ github.event.action }}, Authorized: ${IS_AUTHORIZED}"

      - name: 'Parse command'
        id: 'parse'
        env:
          EVENT_NAME: '${{ github.event_name }}'
          COMMENT_BODY: '${{ github.event.comment.body || github.event.review.body || '' }}'
          IS_PR: '${{ !!github.event.pull_request }}'
          IS_ISSUE: '${{ github.event_name == ''issues'' }}'
        run: |-
          COMMAND="fallthrough"
          CONTEXT=""

          if [[ "${IS_PR}" == "true" && "${EVENT_NAME}" == "pull_request" ]]; then
            COMMAND="review"
          elif [[ "${IS_ISSUE}" == "true" ]]; then
            COMMAND="triage"
          elif [[ "${COMMENT_BODY}" == "@gemini-cli review"* ]]; then
            COMMAND="review"
            CONTEXT="${COMMENT_BODY#@gemini-cli review}"
          elif [[ "${COMMENT_BODY}" == "@gemini-cli triage"* ]]; then
            COMMAND="triage"
            CONTEXT="${COMMENT_BODY#@gemini-cli triage}"
          elif [[ "${COMMENT_BODY}" == "@gemini-cli"* ]]; then
            SUBCOMMAND="${COMMENT_BODY#@gemini-cli}"
            SUBCOMMAND="${SUBCOMMAND## }"
            SUBCOMMAND="${SUBCOMMAND%% *}"
            if [[ -z "${SUBCOMMAND}" || "${SUBCOMMAND}" == "invoke" ]]; then
              COMMAND="invoke"
              CONTEXT="${COMMENT_BODY#@gemini-cli}"
            else
              COMMAND="reject"
              echo "Unknown @gemini-cli subcommand: '${SUBCOMMAND}'. Valid usage: '@gemini-cli review', '@gemini-cli triage', or '@gemini-cli [prompt]'"
            fi
          fi

          if [[ ${#CONTEXT} -gt 500 ]]; then
            echo "Context length (${#CONTEXT}) exceeds 500 characters; truncating."
            CONTEXT="${CONTEXT:0:500}"
          fi

          echo "command=${COMMAND}" >> "$GITHUB_OUTPUT"
          {
            echo "additional_context<<EOF"
            echo "${CONTEXT}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  review:
    needs: 'dispatch'
    if: '${{ needs.dispatch.outputs.command == ''review'' }}'
    uses: './.github/workflows/gemini-review.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  triage:
    needs: 'dispatch'
    if: '${{ needs.dispatch.outputs.command == ''triage'' }}'
    uses: './.github/workflows/gemini-triage.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  invoke:
    needs: 'dispatch'
    if: '${{ needs.dispatch.outputs.command == ''invoke'' }}'
    uses: './.github/workflows/gemini-invoke.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'
