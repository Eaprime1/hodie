name: 'Gemini Dispatch'

on:
  pull_request_review_comment:
    types: ['created']
  pull_request_review:
    types: ['submitted']
  pull_request:
    types: ['opened', 'synchronize', 'reopened']
  issues:
    types: ['opened', 'reopened']
  issue_comment:
    types: ['created']
  workflow_dispatch: {}

defaults:
  run:
    shell: 'bash'

jobs:
  dispatch:
    timeout-minutes: 2
    if: |-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false
      ) || (
        github.event_name == 'issues' &&
        contains(fromJSON('["opened", "reopened"]'), github.event.action)
      ) || (
        github.event.sender.type == 'User' &&
        github.event.sender.login != 'dependabot[bot]' &&
        github.event.sender.login != 'renovate[bot]' &&
        startsWith(github.event.comment.body || github.event.review.body || github.event.issue.body || '', '@gemini-cli') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
      )
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      pull-requests: 'read'
      issues: 'read'
    outputs:
      command: '${{ steps.parse.outputs.command }}'
      additional_context: '${{ steps.parse.outputs.additional_context }}'
    steps:
      - name: 'Log event type'
        run: |-
          echo "Event: ${{ github.event_name }}, Action: ${{ github.event.action }}"

      - name: 'Parse command'
        id: 'parse'
        env:
          EVENT_NAME: '${{ github.event_name }}'
          COMMENT_BODY: '${{ github.event.comment.body || github.event.review.body || '' }}'
          IS_PR: '${{ !!github.event.pull_request }}'
          IS_ISSUE: '${{ github.event_name == ''issues'' }}'
        run: |-
          COMMAND="fallthrough"
          CONTEXT=""

          if [[ "${IS_PR}" == "true" && "${EVENT_NAME}" == "pull_request" ]]; then
            COMMAND="review"
          elif [[ "${IS_ISSUE}" == "true" ]]; then
            COMMAND="triage"
          elif [[ "${COMMENT_BODY}" == "@gemini-cli review"* ]]; then
            COMMAND="review"
            CONTEXT="${COMMENT_BODY#@gemini-cli review}"
          elif [[ "${COMMENT_BODY}" == "@gemini-cli triage"* ]]; then
            COMMAND="triage"
            CONTEXT="${COMMENT_BODY#@gemini-cli triage}"
          elif [[ "${COMMENT_BODY}" == "@gemini-cli"* ]]; then
            RAW_CONTEXT="${COMMENT_BODY#@gemini-cli}"
            IFS=$' \t\n' read -r SUBCOMMAND _ <<< "${RAW_CONTEXT}"
            if [[ -z "${SUBCOMMAND}" || "${SUBCOMMAND}" == "invoke" ]]; then
              COMMAND="invoke"
              CONTEXT="${RAW_CONTEXT}"
            else
              echo "Unknown @gemini-cli subcommand: '${SUBCOMMAND}'. Valid usage: '@gemini-cli review', '@gemini-cli triage', or '@gemini-cli [prompt]'" >&2
              exit 1
            fi
          fi

          if [[ ${#CONTEXT} -gt 500 ]]; then
            echo "Context length (${#CONTEXT}) exceeds 500 characters; truncating."
            CONTEXT="${CONTEXT:0:500}"
          fi

          echo "command=${COMMAND}" >> "$GITHUB_OUTPUT"
          OUTPUT_DELIMITER="HODIE_OUTPUT_$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 16)"
          # Ensure the delimiter cannot appear inside CONTEXT (strip it out if present)
          SAFE_CONTEXT="${CONTEXT//${OUTPUT_DELIMITER}/}"
          {
            echo "additional_context<<${OUTPUT_DELIMITER}"
            echo "${SAFE_CONTEXT}"
            echo "${OUTPUT_DELIMITER}"
          } >> "$GITHUB_OUTPUT"

  review:
    needs: 'dispatch'
    if: '${{ needs.dispatch.outputs.command == ''review'' }}'
    uses: './.github/workflows/gemini-review.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  triage:
    needs: 'dispatch'
    if: '${{ needs.dispatch.outputs.command == ''triage'' }}'
    uses: './.github/workflows/gemini-triage.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  invoke:
    needs: 'dispatch'
    if: '${{ needs.dispatch.outputs.command == ''invoke'' }}'
    uses: './.github/workflows/gemini-invoke.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  conclude:
    name: 'Conclude'
    runs-on: 'ubuntu-latest'
    needs: ['dispatch', 'review', 'triage', 'invoke']
    if: '!cancelled()'
    permissions: {}
    steps:
      - name: 'Check for upstream failures'
        env:
          DISPATCH_RESULT: '${{ needs.dispatch.result }}'
          REVIEW_RESULT: '${{ needs.review.result }}'
          TRIAGE_RESULT: '${{ needs.triage.result }}'
          INVOKE_RESULT: '${{ needs.invoke.result }}'
        run: |-
          echo "dispatch=${DISPATCH_RESULT} review=${REVIEW_RESULT} triage=${TRIAGE_RESULT} invoke=${INVOKE_RESULT}"
          results=("${DISPATCH_RESULT}" "${REVIEW_RESULT}" "${TRIAGE_RESULT}" "${INVOKE_RESULT}")
          for r in "${results[@]}"; do
            if [[ "${r}" == "failure" ]]; then
              echo "::error::Upstream job failed (result=${r})." >&2
              exit 1
            fi
          done
          echo "All jobs either succeeded or were skipped."
# ∰🛠️♓-salmon_canon
