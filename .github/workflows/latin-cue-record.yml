name: Hodie — Latin Cue Record

# When the owner comments a Latin workflow call on a PR (docs/latin-workflow.md),
# this gathers the PR's state into one comment, so the final review before merge
# has it in one place:
#   - a log of every cue: when, which call, who, and the head commit at the time
#   - commits pushed since the previous cue, with a compare link
#   - checks on the head commit: passed, failed, still running
#   - unresolved review threads, merge state, draft and labels
#
# It also records a Prima Recensio when a PR opens ready for review or is marked
# ready for review: the first witness. That row is logged by the event, with no
# comment needed.
#
# It only records. It calls no model, and it doesn't review, seal or merge.
# Cues are read by .github/scripts/cue-parser.js: owner only, never a bot, never a
# comment with the Claude Code footer, never a cue inside quotes or code.
# Same idea as custos's latin-cue-record.yml, without the observation document.

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: write
  issues: write

concurrency:
  # One update at a time per PR, and never cancel one: each run adds a log row.
  group: latin-cue-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  record:
    # Cheap pre-filter (contains() ignores case); the cue parser does the exact match.
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.fork == false &&
       github.event.sender.type != 'Bot') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.type != 'Bot' &&
       github.event.comment.author_association == 'OWNER' &&
       (contains(github.event.comment.body, 'recensio') ||
        contains(github.event.comment.body, 'probatio') ||
        contains(github.event.comment.body, 'lustratio') ||
        contains(github.event.comment.body, 'judicium') ||
        contains(github.event.comment.body, 'novissimum') ||
        contains(github.event.comment.body, 'cursus') ||
        contains(github.event.comment.body, 'emenda') ||
        contains(github.event.comment.body, 'renovata')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The reader comes from the base branch, so a PR cannot loosen it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Record the cue and gather the PR's state
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await require('./.github/scripts/latin-cue-record.js').run({ github, context, core });
