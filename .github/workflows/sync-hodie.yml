name: Sync hodie from Google Drive

on:
  schedule:
    - cron: '0 12 * * *'  # noon UTC daily
  workflow_dispatch:        # manual trigger from the GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit and push synced files back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[drive]"

      - name: Sync hodie folder from Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        run: python .scripts/sync_hodie.py

      - name: Commit and push synced files
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -d hodie ]; then
            git add hodie/
          else
            echo "hodie/ does not exist — nothing to stage."
            exit 0
          fi
          
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
            exit 0
          fi
          
          git commit -m "hodie: sync $(date -u '+%Y-%m-%d')"
          git pull --rebase --autostash
          git push

# 🔧 Repair: Drive sync now tolerates non-downloadable Google Workspace files.
  notify-on-failure:
    needs: sync
    if: always() && needs.sync.result == 'failure'
    uses: ./.github/workflows/notify-repeated-failure.yml
    with:
      workflow_file: sync-hodie.yml
      threshold: 3
    permissions:
      issues: write
      actions: read

