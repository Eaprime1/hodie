name: Notify on Repeated Workflow Failure

on:
  workflow_call:
    inputs:
      workflow_file:
        description: "Filename of the workflow to check (e.g. sync-hodie.yml)"
        required: true
        type: string
      threshold:
        description: "Consecutive failures required before opening an issue"
        required: false
        type: number
        default: 3

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Check consecutive failures and notify
        uses: actions/github-script@v7
        with:
          script: |
            const workflowFile = '${{ inputs.workflow_file }}';
            const threshold = ${{ inputs.threshold }};

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowFile,
              per_page: threshold + 2,
            });

            const runs = data.workflow_runs.filter(r => r.status === 'completed');
            let consecutive = 0;
            for (const run of runs) {
              if (run.conclusion === 'failure') consecutive++;
              else break;
            }
            core.info(`${workflowFile}: ${consecutive} consecutive failing run(s) (threshold ${threshold}).`);

            if (consecutive < threshold) {
              core.info('Below threshold — nothing to do.');
              return;
            }

            // One issue per incident. If one is already open for this workflow,
            // don't open another or comment again — that would just burn more
            // resources on top of the failures themselves.
            const marker = `<!-- workflow-failure-watch:${workflowFile} -->`;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-failure',
              per_page: 100,
            });
            if (openIssues.some(i => i.body && i.body.includes(marker))) {
              core.info('An open tracking issue already exists for this workflow — skipping.');
              return;
            }

            // Make sure the label exists before we reference it — a fresh repo
            // (or one that's never had a failure yet) won't have it.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'workflow-failure',
                color: 'b60205',
                description: 'Auto-filed: a workflow has failed repeated consecutive runs',
              });
            } catch (err) {
              if (err.status !== 422) throw err; // 422 = label already exists
            }

            const latest = runs[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Workflow failing repeatedly: ${workflowFile}`,
              labels: ['workflow-failure'],
              body: [
                marker,
                '',
                `**${workflowFile}** has failed its last **${consecutive}** consecutive completed runs.`,
                '',
                `Latest failing run: ${latest.html_url}`,
                '',
                'This issue was opened automatically so a workflow stuck failing does not keep burning CI resources unnoticed.',
                'Fix the underlying problem and close this issue — a new one will only be opened if the workflow starts failing repeatedly again after that.',
              ].join('\n'),
            });
