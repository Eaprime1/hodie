name: Pylint

on:
  push:
    paths:
      - '**.py'
      - '.pylintrc'
      - '.github/workflows/pylint.yml'
  pull_request:
    paths:
      - '**.py'

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint

    - name: Lint active codebase
      run: |
        # Only lint active code directories, not archived/legacy content.
        # Enforce project policy from pyproject.toml: fail-under = 7.0
        set +e
        pylint crawler_pixel8/ redundancy_entity/ --rcfile=.pylintrc > pylint-report.txt
        pylint_exit_code=$?
        set -e

        cat pylint-report.txt
        echo "Raw pylint exit code: $pylint_exit_code"

        python - <<'PY'
        import re
        import sys
        from pathlib import Path

        report = Path("pylint-report.txt").read_text(encoding="utf-8")
        score_match = re.search(r"rated at ([0-9.]+)/10", report)
        if not score_match:
            preview = report[-1000:] if report else "<empty report>"
            raise SystemExit(
                "Unable to parse pylint score from pylint-report.txt. "
                f"Report tail preview:\n{preview}"
            )

        pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
        threshold_match = re.search(r"(?m)^\\s*fail-under\\s*=\\s*([0-9.]+)\\s*$", pyproject)
        if not threshold_match:
            raise SystemExit("Unable to parse fail-under from pyproject.toml")

        score = float(score_match.group(1))
        threshold = float(threshold_match.group(1))
        print(f"Evaluated pylint score: {score:.2f}/10 (required >= {threshold:.1f})")
        if score < threshold:
            sys.exit(1)
        PY
