name: Pylint

on:
  push:
    paths:
      - '**.py'
      - '.pylintrc'
      - '.github/workflows/pylint.yml'
  pull_request:
    paths:
      - '**.py'

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tomli
        python -m pip install pylint

    - name: Lint active codebase
      run: |
        # Only lint active code directories, not archived/legacy content.
        # Gate on pyproject's fail-under score instead of raw pylint exit code.
        set -euo pipefail
        set +e
        pylint crawler_pixel8/ redundancy_entity/ --rcfile=.pylintrc > pylint.log 2>&1
        PYLINT_EXIT=$?
        set -e
        # Fail on fatal/error/usage bits only (1 + 2 + 32 = 35).
        # Allow warnings/refactors/conventions and score-gate those below.
        if (( PYLINT_EXIT & 35 )); then
          cat pylint.log
          echo "Pylint exited with fatal/error/usage bits set: ${PYLINT_EXIT}"
          exit "${PYLINT_EXIT}"
        fi
        cat pylint.log
        PY_FAIL_UNDER=$(python - <<'PY'
import pathlib
try:
    import tomllib as toml_loader
except ModuleNotFoundError:  # Python < 3.11
    # Fallback for Python < 3.11 where tomllib is unavailable.
    import tomli as toml_loader
with open(pathlib.Path("pyproject.toml"), "rb") as f:
    pyproject = toml_loader.load(f)
print(pyproject["tool"]["pylint"]["main"]["fail-under"])
PY
)
        PY_SCORE=$(python - <<'PY'
import pathlib
import re
text = pathlib.Path("pylint.log").read_text(encoding="utf-8")
match = re.search(r"rated at (-?[0-9]+(?:\.[0-9]+)?)/10", text)
if not match:
    raise SystemExit(
        "Unable to parse pylint score from output. "
        "The log may be truncated or pylint may have crashed."
    )
print(match.group(1))
PY
)
        echo "Pylint score: ${PY_SCORE}/10 (required: ${PY_FAIL_UNDER}/10)"
        python - <<'PY' "${PY_SCORE}" "${PY_FAIL_UNDER}"
import sys
score = float(sys.argv[1])
required = float(sys.argv[2])
if score < required:
    raise SystemExit(f"Pylint score {score}/10 is below required {required}/10.")
print("Pylint score threshold satisfied.")
PY
