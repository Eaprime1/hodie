name: Pylint

on:
  push:
    paths:
      - '**.py'
      - '.pylintrc'
      - '.github/workflows/pylint.yml'
  pull_request:
    paths:
      - '**.py'

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # tomli is not required because this workflow no longer parses pyproject.toml.
        pip install pylint

    - name: Lint active codebase
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}
      run: |
        # Only lint active code directories, not archived/legacy content
        set -o pipefail
        : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
        safe_python_version="${PYTHON_VERSION//./-}"
        pylint_log="$(mktemp "${RUNNER_TEMP}/pylint-output-${safe_python_version}-XXXXXX.log")"
        trap 'rm -f "$pylint_log"' EXIT
        set +e
        pylint crawler_pixel8/ redundancy_entity/ --rcfile=.pylintrc | tee "$pylint_log"
        pylint_exit="${PIPESTATUS[0]}"
        # Decision for this workflow: remove score-gating and fail-under parsing in favor of
        # explicit pylint exit-bit gating for robustness and simpler maintenance.
        # This workflow intentionally gates on pylint's fatal/error/usage bits
        # so CI blocks only on critical lint outcomes, not style-only warnings.
        # It does not gate on global score or pyproject fail-under.
        # pylint bitmask values: fatal=1, error=2, warning=4, refactor=8, convention=16, usage=32.
        fatal_error_usage_mask=$((1 | 2 | 32))
        if [ $((pylint_exit & fatal_error_usage_mask)) -ne 0 ]; then
          echo "❌ Pylint reported fatal/error/usage issues (exit code: $pylint_exit)."
          exit "$pylint_exit"
        fi
        echo "✅ Pylint review mark: no fatal/error/usage issues (exit code: $pylint_exit)."
