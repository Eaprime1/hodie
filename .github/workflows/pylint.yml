name: Pylint

on:
  push:
    paths:
      - '**.py'
      - '.pylintrc'
      - '.github/workflows/pylint.yml'
  pull_request:
    paths:
      - '**.py'

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint

    - name: Lint active codebase
      run: |
        # Only lint active code directories, not archived/legacy content.
        # Gate on configured fail-under score instead of raw pylint exit code.
        set +e
        log_file=$(mktemp "${RUNNER_TEMP:-/tmp}/pylint-${GITHUB_RUN_ID:-local}-XXXXXX.log")
        pylint crawler_pixel8/ redundancy_entity/ --rcfile=.pylintrc | tee "${log_file}"
        set -e
        export PYLINT_LOG_FILE="${log_file}"

        python - <<'PY'
        import os
        import re
        import sys
        from pathlib import Path

        number_pattern = r"[0-9]+(?:\.[0-9]+)?"
        error_context_lines = 5
        log_path = Path(os.environ["PYLINT_LOG_FILE"])
        log_text = log_path.read_text(encoding="utf-8")
        score_match = re.search(rf"rated at ({number_pattern})/10", log_text)
        if not score_match:
            excerpt = "\n".join(log_text.strip().splitlines()[-error_context_lines:])
            raise SystemExit(
                f"Unable to parse pylint score from output in {log_path}. "
                f'Expected format: "rated at X/10". Last log lines:\n{excerpt}'
            )
        score = float(score_match.group(1))

        pyproject_text = Path("pyproject.toml").read_text(encoding="utf-8")
        fail_under_match = re.search(rf"fail-under\s*=\s*({number_pattern})", pyproject_text)
        if not fail_under_match:
            raise SystemExit("Unable to parse fail-under from pyproject.toml.")
        fail_under = float(fail_under_match.group(1))

        print(f"Pylint score: {score:.2f}/10 (required >= {fail_under:.2f})")
        if score < fail_under:
            sys.exit(1)
        PY
