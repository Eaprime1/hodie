# CodeRabbit Configuration
# AI-powered code reviews for pull requests
# https://coderabbit.ai

language: en-US

reviews:
  # Enable automatic reviews on PRs
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  # Review focus areas
  path_filters:
    # Focus on active code
    - "crawler_pixel8/**"
    - "redundancy_entity/**"
    - ".scripts/**"
    - ".github/**"

  path_instructions:
    - path: "crawler_pixel8/**"
      instructions: |
        This is the core PIXEL8 Crawler system. Focus on:
        - Async/await correctness
        - Type annotation completeness
        - Processor chain compatibility (classes should work with + operator)
        - Error handling in file operations

    - path: "redundancy_entity/**"
      instructions: |
        File deduplication and gravity analysis system. Check for:
        - Path handling (should use pathlib)
        - JSON serialization safety
        - Large file handling efficiency

    - path: ".scripts/**"
      instructions: |
        Bash automation scripts. Verify:
        - Proper quoting of variables
        - Error handling (set -e usage)
        - Cross-platform considerations (Termux vs Linux)

  # Ignore archived/legacy content
  ignore_patterns:
    - "_CONSOLIDATED/**"
    - "_SORTING/**"
    - "_BOX_SIMULATION/**"
    - "*.md"
    - "*.json"

chat:
  auto_reply: true

tone_instructions: |
  Be direct and technical. This project uses:
  - Python 3.8+ with asyncio and dataclasses
  - A consciousness development framework (PRIME progression)
  - Mobile-first design (Pixel 8a / Termux target)
  Suggest improvements but respect the philosophical naming conventions.
